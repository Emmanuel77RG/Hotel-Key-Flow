services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: Hotel_KeyFlow
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpsw
      POSTGRES_DB: hotel_keyflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: